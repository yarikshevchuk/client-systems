services:
  db:
    image: postgres:16
    container_name: vns-postgres
    environment:
      POSTGRES_USER: vns
      POSTGRES_PASSWORD: vns
      POSTGRES_DB: vns
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - vns-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vns -d vns"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  vns-pgdata:
